<style>
/* Layout: sticky shop sign + tab strip, one filter row, then a single working column of panels per tab. */
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16211e; --surface-2: #1d2a26; --ink: #e5eee9; --muted: #95a8a0;
    --line: #2b3a35; --accent: #3aa572; --accent-ink: #06140d; --accent-soft: #1d3a2d;
    --tag: #f2c230; --tag-ink: #2b2205; --series-a: #3aa572; --series-b: #6f93e0;
    --good: #5cc283; --warn: #e3a648; --bad: #ef7b6b; --good-soft: #17352a; --warn-soft: #3a2d14; --bad-soft: #3d1f1b;
    --heat-0: #1b2723; --heat-1: #3aa572; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16211e; --surface-2: #1d2a26; --ink: #e5eee9; --muted: #95a8a0;
  --line: #2b3a35; --accent: #3aa572; --accent-ink: #06140d; --accent-soft: #1d3a2d;
  --tag: #f2c230; --tag-ink: #2b2205; --series-a: #3aa572; --series-b: #6f93e0;
  --good: #5cc283; --warn: #e3a648; --bad: #ef7b6b; --good-soft: #17352a; --warn-soft: #3a2d14; --bad-soft: #3d1f1b;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }

.app { min-height: 100vh; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, td.n, .kpi .v { font-variant-numeric: tabular-nums; }

h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

/* header */

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }

.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }

/* filter bar */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding-block: 14px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: .78rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }

.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: .84rem; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* panels */
main { padding-block: 4px 60px; display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }

.explain { color: var(--muted); font-size: .92rem; max-width: 70ch; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.kpi .v { font-size: 1.6rem; font-weight: 800; line-height: 1.15; }

.kpi.alert { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: var(--warn-soft); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { background: var(--surface-2); font-weight: 700; font-size: .8rem; color: var(--muted); position: sticky; top: 0; cursor: default; }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--ink); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: left; }
td.wrap { white-space: normal; min-width: 180px; }
.scroll-y { max-height: 460px; overflow-y: auto; }
input.cost { width: 82px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--surface); text-align: left; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }

.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.up { color: var(--good); font-weight: 700; } .down { color: var(--bad); font-weight: 700; }

/* bars */
.hbars { display: grid; gap: 7px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 10px; align-items: center; font-size: .9rem; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--series-a); border-radius: 4px 0 0 4px; }
.hbar .val { font-variant-numeric: tabular-nums; min-width: 72px; text-align: left; font-weight: 600; }

/* charts */
.chart { position: relative; width: 100%; direction: ltr; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: .82rem; line-height: 1.35; direction: rtl; box-shadow: var(--shadow); max-width: 240px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-left: 5px; }

.heat { display: grid; gap: 2px; direction: ltr; font-size: .72rem; overflow-x: auto; }
.heat .row { display: grid; grid-template-columns: 34px repeat(var(--cols), minmax(22px, 1fr)); gap: 2px; min-width: max-content; }
.heat .cell { height: 24px; border-radius: 3px; background: var(--heat-0); }
.heat .lab { color: var(--muted); display: flex; align-items: center; justify-content: center; }

/* exercise */
.exercise { border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; }
.exercise .eyebrow { font-size: .76rem; letter-spacing: .06em; font-weight: 800; color: var(--accent); }
.exercise .q { font-size: 1rem; max-width: 75ch; }
.exercise .opts { display: grid; gap: 8px; }
.exercise .opt { text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.exercise .opt:hover { border-color: var(--accent); }
.exercise .opt.right { border-color: var(--good); background: var(--good-soft); }
.exercise .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.exercise .sol { background: var(--surface); border-radius: 8px; padding: 12px 14px; border: 1px solid var(--line); max-width: 80ch; }
.exercise .sol b { font-weight: 800; }

/* cards in lists */
.reco { display: grid; gap: 10px; }
.reco-item { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
.reco-item .ico { grid-row: span 2; width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-size: 1rem; }
.reco-item .t { font-weight: 700; }
.reco-item .d { color: var(--muted); font-size: .9rem; }

/* data tab */
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 26px; text-align: center; display: grid; gap: 8px; justify-items: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { font-size: 1.05rem; }
.maprow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; align-items: end; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
textarea.paste { width: 100%; min-height: 110px; direction: ltr; font-family: ui-monospace, Menlo, monospace; font-size: .82rem; }
.msg { font-size: .9rem; padding: 8px 12px; border-radius: 8px; }
.msg.ok { background: var(--good-soft); color: var(--good); }
.msg.err { background: var(--bad-soft); color: var(--bad); }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(5,15,10,.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; max-width: 640px; width: 100%; max-height: 90vh; overflow: auto; padding: 20px; display: grid; gap: 14px; }
.modal textarea { width: 100%; min-height: 260px; font-size: .85rem; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 999px; z-index: 70; font-weight: 600; }

.muted { color: var(--muted); }
.small { font-size: .85rem; }
.empty { padding: 26px; text-align: center; color: var(--muted); }
@media (max-width: 560px) {

@media (prefers-reduced-motion: no-preference) {
  .fill { transition: width .4s ease; }
}

<script>
(function(){
"use strict";
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('he-IL', {maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('he-IL', {maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('he-IL', {minimumFractionDigits:2, maximumFractionDigits:2});
const money = v => (v < 0 ? '-' : '') + '₪' + nf0.format(Math.abs(Math.round(v||0)));
const money2 = v => (v < 0 ? '-' : '') + '₪' + nf2.format(Math.abs(v||0));
const pct = (v, d=1) => (v==null || !isFinite(v)) ? '—' : (d ? nf1.format(v*100) : nf0.format(v*100)) + '%';
const signPct = v => (v==null || !isFinite(v)) ? '—' : (v>0?'+':'') + nf1.format(v*100) + '%';
const DOW = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const DOW_FULL = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const dowOf = s => parseYmd(s).getDay();
const heDate = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return `${+d}.${+m}.${y.slice(2)}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const sum = a => a.reduce((x,y)=>x+y,0);
const median = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const quant = (a, q) => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[Math.min(s.length-1, Math.floor(q*(s.length-1)))]; };
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }

/* ---------- state ---------- */
const S = {

  reports: [],          // {id,name,createdAt,from,to,rowCount,active,rows:[...] }
  catalog: {},          // name -> {c, cost, stock, lead}

  rows: [],
  filter: { from: '', to: '', cat: '', prod: '' },
  cmp: { aFrom:'', aTo:'', bFrom:'', bTo:'' },
  plan: { lead: 2, cover: 7 },
  sort: { products: { k: 's', dir: -1 } },

};

/* ---------- sample data (shown until the first real report is saved) ---------- */
function rng(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
const SAMPLE_PRODUCTS = [
  ['חלב 3% 1 ליטר','חלב ומוצריו',6.9,5.1,40],['קוטג׳ 5%','חלב ומוצריו',6.5,4.6,30],['גבינה לבנה 5%','חלב ומוצריו',5.9,4.2,24],['יוגורט פירות','חלב ומוצריו',4.5,2.9,36],['שוקו בשקית','חלב ומוצריו',4.2,2.6,50],['חמאה 200 גר׳','חלב ומוצריו',9.9,7.4,12],
  ['לחם אחיד פרוס','לחם ומאפים',7.9,6.2,30],['לחמניות 6 יח׳','לחם ומאפים',9.5,6.1,18],['חלה','לחם ומאפים',12,7.8,10],['בורקס גבינה','לחם ומאפים',6,2.9,null],['פיתות 10 יח׳','לחם ומאפים',8.9,5.9,20],
  ['קולה 1.5 ליטר','משקאות',8.9,5.4,60],['מים מינרליים 1.5','משקאות',4.5,1.9,80],['מיץ תפוזים 1 ליטר','משקאות',11.9,7.6,20],['פחית אנרגיה','משקאות',8,4.1,36],['בירה 500 מ״ל','משקאות',9.9,5.8,48],['סודה 1.5 ליטר','משקאות',4.9,2.4,30],

const SAMPLE_COST_MISSING = new Set(['בורקס גבינה','עוגיות שוקולד צ׳יפס','בננות לק״ג','פיצה קפואה','טחינה גולמית']);
function buildSample(){
  const R = rng(20261107);
  const end = '2026-11-07', days = 42, start = addDays(end, -(days-1));
  const weights = [9,6,4,6,7,3, 9,5,3,4,4, 7,8,3,4,4,3, 7,6,5,5,3,2, 5,4,4,3, 2,3,2,3,2,1, 1,2,2,1, 4,1,4,1];
  const W = sum(weights);
  const pick = () => { let x = R()*W; for(let i=0;i<weights.length;i++){ x -= weights[i]; if(x<=0) return i; } return 0; };
  const hourW = {7:5,8:9,9:7,10:6,11:6,12:8,13:9,14:7,15:6,16:8,17:11,18:12,19:10,20:8,21:5,22:2};
  const rows = []; let tx = 1000;
  for(let i=0;i<days;i++){
    const d = addDays(start, i), dw = dowOf(d);
    if(dw === 6) continue; // closed on Saturday
    const trend = 1 + i*0.004;
    let base = dw === 5 ? 210 : (dw === 4 ? 175 : 145);
    const n = Math.round(base * trend * (0.9 + R()*0.2));
    const hours = Object.entries(hourW).filter(([h]) => dw !== 5 || +h <= 15);
    const hw = sum(hours.map(h=>h[1]));
    for(let k=0;k<n;k++){
      let x = R()*hw, h = 7; for(const [hh,w] of hours){ x -= w; if(x<=0){ h = +hh; break; } }
      const items = 1 + Math.floor(R()*R()*6); tx++;
      const seen = new Map();
      for(let j=0;j<items;j++){
        let p = pick();
        if(j>0 && seen.has(7) && R()<.35) p = 0; // lachmaniyot -> milk pairing
        if(j>0 && seen.has(17) && R()<.3) p = 11; // bamba -> cola pairing
        seen.set(p, (seen.get(p)||0) + 1);
      }
      for(const [p, q] of seen){
        const P = SAMPLE_PRODUCTS[p];
        const qty = P[0].includes('לק״ג') ? Math.round((0.5 + R()*1.5)*100)/100 : q;
        rows.push({ d, h, t: 'T'+tx, p: P[0], c: P[1], q: qty, s: Math.round(qty*P[2]*100)/100 });
      }
    }
  }
  const catalog = {};
  SAMPLE_PRODUCTS.forEach(P => { catalog[P[0]] = { c: P[1], cost: SAMPLE_COST_MISSING.has(P[0]) ? null : P[3], stock: P[4], lead: P[1]==='לחם ומאפים'||P[1]==='חלב ומוצריו' ? 1 : 3 }; });
  return { rows, catalog, fixed: { electricity: 3200, arnona: 1850, bank: 1100, salary: 24000, loans: 4500, rent: 9000, other: 1200 } };
}

function lineChart(el, series, labels, opts = {}){
  const W = Math.max(280, el.clientWidth || 600), H = opts.height || 220, m = { t: 12, r: 10, b: 26, l: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = Math.max(...series.map(s=>s.values.length), 1);
  const max = niceMax(Math.max(0, ...series.flatMap(s=>s.values)));
  const X = i => m.l + (n === 1 ? iw/2 : (i/(n-1))*iw), Y = v => m.t + ih - (v/max)*ih;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'גרף קווי')}"><g class="grid">`;
  [0,.25,.5,.75,1].forEach(f => { const y = Y(f*max); s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${shortMoney(f*max)}</text>`; });
  s += `</g>`;
  const labEvery = Math.ceil(n / Math.max(1, Math.floor(iw / 50)));
  for(let i=0;i<n;i+=labEvery) s += `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(labels[i] ?? '')}</text>`;
  series.forEach(se => {
    const pts = se.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = se.values.length-1; if(li>=0) s += `<circle cx="${X(li)}" cy="${Y(se.values[li])}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  s += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  s += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg>`;
  el.innerHTML = s;
  const hit = el.querySelector('.hit'), xh = el.querySelector('.xh'), svg = el.querySelector('svg');
  hit.addEventListener('mousemove', e => {
    const bx = svg.getBoundingClientRect(); const x = (e.clientX - bx.left) * (W / bx.width);
    const i = Math.max(0, Math.min(n-1, Math.round(((x - m.l)/iw)*(n-1))));
    xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('visibility','visible');
    showTip(e, opts.tip ? opts.tip(i) : series.map(se => `${esc(se.name)}: ${money(se.values[i]||0)}`).join('<br>'));
  });
  hit.addEventListener('mouseleave', () => { xh.setAttribute('visibility','hidden'); hideTip(); });
}
function hbars(items, fmt = money, max){
  const mx = max ?? Math.max(...items.map(i=>i.v), 1);
  return `<div class="hbars">${items.map(i => `<div class="hbar" title="${esc(i.title || '')}"><span class="name">${esc(i.label)}</span><span class="track"><span class="fill" style="display:block;width:${Math.max(0.5, (i.v/mx)*100)}%;${i.color?'background:'+i.color:''}"></span></span><span class="val">${fmt(i.v)}</span></div>`).join('')}</div>`;
}
function heatmap(A){
  const hours = []; for(let h=0;h<24;h++) if(A.hourSales[h] > 0) hours.push(h);
  if(!hours.length) return `<p class="muted small">בדוח אין שעות, לכן אין מפת חום. הוסף עמודת שעה כדי לראות אותה.</p>`;
  const dayCount = Array(7).fill(0); Object.keys(A.byDate).forEach(d => dayCount[dowOf(d)]++);
  let max = 0; const val = (d,h) => dayCount[d] ? A.dowHour[d][h]/dayCount[d] : 0;
  for(let d=0;d<7;d++) for(const h of hours) max = Math.max(max, val(d,h));
  let s = `<div class="heat" style="--cols:${hours.length}" role="img" aria-label="מכירות ממוצעות לפי יום בשבוע ושעה">`;
  s += `<div class="row"><span></span>${hours.map(h=>`<span class="lab">${h}</span>`).join('')}</div>`;
  for(let d=0;d<7;d++){
    if(!dayCount[d]) continue;
    s += `<div class="row"><span class="lab">${DOW[d]}</span>`;
    for(const h of hours){ const v = val(d,h), a = max ? v/max : 0; s += `<span class="cell" data-tip="יום ${DOW_FULL[d]}, ${h}:00–${h+1}:00<br>ממוצע ${money(v)} ליום" style="background:color-mix(in srgb, var(--heat-1) ${Math.round(a*100)}%, var(--heat-0))"></span>`; }
    s += `</div>`;
  }
  return s + `</div><div class="legend"><span>חלש</span><span style="display:inline-block;width:120px;height:10px;border-radius:3px;background:linear-gradient(to left, var(--heat-1), var(--heat-0))"></span><span>חזק</span><span>· ממוצע מכירות ליום, לפי יום בשבוע ושעה</span></div>`;
}
function wireTips(root){ root.querySelectorAll('[data-tip]').forEach(el => { el.addEventListener('mousemove', e => showTip(e, el.dataset.tip)); el.addEventListener('mouseleave', hideTip); }); }

/* ---------- exercises ---------- */

  const ans = S.answered[key];
  return `<section class="exercise" data-ex="${esc(key)}">
    <span class="eyebrow">תרגיל החלטה עסקית</span>

    <p class="q">${ex.q}</p>
    <div class="opts">${ex.options.map((o,i) => `<button type="button" class="opt ${ans!=null ? (o.ok ? 'right' : (ans===i ? 'wrong' : '')) : ''}" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
    ${ans!=null ? `<div class="sol"><b>${ex.options[ans].ok ? 'נכון.' : 'לא בדיוק.'}</b> ${ex.explain}</div>` : `<p class="small muted">בחר תשובה כדי לראות את הפתרון המוסבר.</p>`}
  </section>`;
}
function wireExercises(root){
  root.querySelectorAll('.exercise').forEach(sec => sec.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { S.answered[sec.dataset.ex] = +b.dataset.i; render(); })));
}
function shuffleOpts(opts, seed){ const r = rng(seed); return opts.map(o=>[r(),o]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }

/* ---------- filters ---------- */
function categories(){ return [...new Set(S.rows.map(r=>r.c))].sort((a,b)=>a.localeCompare(b,'he')); }
function productsList(cat){ return [...new Set(S.rows.filter(r=>!cat || r.c===cat).map(r=>r.p))].sort((a,b)=>a.localeCompare(b,'he')); }
function renderFilters(){
  const el = $('#filters');
  if(S.tab === 'data' || S.tab === 'compare'){ el.innerHTML = S.tab === 'compare' ? `<p class="small muted">בהשוואה בוחרים שתי תקופות בתוך המסך. סינון לפי קטגוריה ומוצר חל גם כאן.</p>` + catProdFields() : ''; wireFilterFields(); return; }
  const [a, b] = dataExtent();
  el.innerHTML = `
    <div class="field"><label for="fFrom">מתאריך</label><input type="date" id="fFrom" value="${S.filter.from}" min="${a||''}" max="${b||''}"></div>

    <div class="field"><label>טווח מהיר</label><div class="quick">
      ${[['7','7 ימים'],['14','14 ימים'],['30','30 ימים'],['all','הכול']].map(([k,l]) => `<button type="button" class="chip ${quickActive(k)?'on':''}" data-q="${k}">${l}</button>`).join('')}
    </div></div>
    ${catProdFields()}`;
  $('#fFrom').addEventListener('change', e => { S.filter.from = e.target.value; render(); });
  $('#fTo').addEventListener('change', e => { S.filter.to = e.target.value; render(); });
  el.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.q; if(k==='all'){ S.filter.from=''; S.filter.to=''; } else { S.filter.to = b2; S.filter.from = addDays(b2, -(+k-1)); } render(); }));

  wireFilterFields();
}
function quickActive(k){ const [,b] = dataExtent(); if(k==='all') return !S.filter.from && !S.filter.to; return S.filter.to === b && S.filter.from === addDays(b||'2000-01-01', -(+k-1)); }
function catProdFields(){
  const cats = categories(), prods = productsList(S.filter.cat);
  return `<div class="field"><label for="fCat">קטגוריה</label><select id="fCat"><option value="">כל הקטגוריות</option>${cats.map(c=>`<option ${c===S.filter.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label for="fProd">מוצר</label><select id="fProd"><option value="">כל המוצרים</option>${prods.map(p=>`<option ${p===S.filter.prod?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
    ${(S.filter.cat||S.filter.prod||S.filter.from||S.filter.to) ? `<button type="button" class="btn small ghost" id="fClear">נקה סינון</button>` : ''}`;
}
function wireFilterFields(){
  $('#fCat')?.addEventListener('change', e => { S.filter.cat = e.target.value; if(S.filter.prod && !productsList(S.filter.cat).includes(S.filter.prod)) S.filter.prod=''; render(); });
  $('#fProd')?.addEventListener('change', e => { S.filter.prod = e.target.value; render(); });
  $('#fClear')?.addEventListener('click', () => { S.filter = { from:'', to:'', cat:'', prod:'' }; render(); });
}
function filterLabel(f = S.filter){
  const parts = [];
  parts.push(f.from || f.to ? `${heDate(f.from) } – ${heDate(f.to)}` : 'כל התקופה');
  if(f.cat) parts.push('קטגוריה: ' + f.cat);
  if(f.prod) parts.push('מוצר: ' + f.prod);
  return parts.join(' · ');
}

  return `<div class="banner info"><p><b>אלה נתוני דוגמה</b> של 6 שבועות במינימרקט, כדי שתראה איך המערכת עובדת. הנתונים שלך יחליפו אותם ברגע שתעלה דוח ראשון מהקופה.</p><a class="btn small primary" href="#data">העלה דוח מהקופה</a></div>`;

function afterDashboard(){

function exDashboard(A){
  if(!A.hasHour) return null;
  const hs = A.hourSales.map((v,h)=>({h, v: v/(A.activeDays||1), tx: A.hourTx[h].size/(A.activeDays||1)})).filter(x=>x.v>0);
  if(hs.length < 4) return null;
  const peak = hs.reduce((a,b)=>b.tx>a.tx?b:a), low = hs.reduce((a,b)=>b.tx<a.tx?b:a);
  const opts = [
    { t: `בשעת השיא ${peak.h}:00, כדי לקצר תורים ולא לאבד לקוחות`, ok: true },
    { t: `בשעה השקטה ${low.h}:00, כי שם יש זמן לסדר מדפים ולמכור יותר`, ok: false },
    { t: `לחלק חצי שעה פה וחצי שעה שם`, ok: false },
  ];
  return { title: 'איפה לשבץ שעת עובד נוספת?', q: `יש לך תקציב לשעת עובד נוספת אחת ביום (כ־₪45). בשעה ${peak.h}:00 יש בממוצע <b>${nf1.format(peak.tx)} עסקאות</b> (${money(peak.v)}), ובשעה ${low.h}:00 רק <b>${nf1.format(low.tx)}</b> (${money(low.v)}). איפה הכי כדאי לשבץ אותה?`,
    options: shuffleOpts(opts, peak.h*31+low.h), explain: `בשעת השיא עובר לקוח כל ${nf1.format(60/Math.max(peak.tx,1))} דקות בממוצע, וכל לקוח שמוותר בגלל תור הוא הפסד של כ־${money2(A.avg)}. מספיק שהעובד הנוסף ימנע עזיבה של ${Math.ceil(45/Math.max(A.avg*(A.margin||0.25),1))} לקוחות כדי שהשעה תחזיר את עצמה ברווח הגולמי (${pct(A.margin||0.25,0)}). סידור מדפים עדיף לעשות בשעה השקטה בידי העובד הקיים.` };
}

/* ---------- view: products ---------- */

  const rows = filterRows(), A = analyze(rows, S.filter);
  if(!rows.length) return emptyView();
  const miss = A.products.filter(p => p.cost === null).sort((a,b)=>b.s-a.s);
  const {k, dir} = S.sort.products;
  const list = [...A.products].sort((a,b) => { const x = a[k], y = b[k]; if(x==null && y==null) return 0; if(x==null) return 1; if(y==null) return -1; return typeof x === 'string' ? dir*x.localeCompare(y,'he') : dir*(x-y); });
  const fast = A.products.filter(p=>p.speed==='fast').sort((a,b)=>b.vel-a.vel), slow = A.products.filter(p=>p.speed==='slow').sort((a,b)=>a.vel-b.vel);
  const th = (key, label, n) => `<th class="sort ${n?'n':''}" data-k="${key}">${label}${k===key ? (dir<0?' ▼':' ▲') : ''}</th>`;

function exProducts(A){
  const withCost = A.products.filter(p => p.gp != null && p.q > 0);
  if(withCost.length < 4) return null;
  const byQty = [...withCost].sort((a,b)=>b.q-a.q)[0];
  const byGp = [...withCost].filter(p=>p.p!==byQty.p).sort((a,b)=>(b.gp/b.q)-(a.gp/a.q))[0];
  if(!byGp) return null;
  const gpA = byQty.gp, gpB = byGp.gp;
  const winner = gpA >= gpB ? byQty : byGp;
  const perA = byQty.gp/byQty.q, perB = byGp.gp/byGp.q;
  const opts = [
    { t: `${byQty.p}, כי הוא נמכר הכי הרבה יחידות`, ok: winner === byQty },
    { t: `${byGp.p}, כי הרווח על כל יחידה גבוה יותר`, ok: winner === byGp },
    { t: 'אין הבדל, לשניהם אותה תרומה לרווח', ok: false },
  ];
  return { title: 'למי לתת את המדף הטוב?', q: `<b>${esc(byQty.p)}</b> נמכר ב־${nf0.format(byQty.q)} יחידות ומרוויח ${money2(perA)} ליחידה. <b>${esc(byGp.p)}</b> נמכר ב־${nf0.format(byGp.q)} יחידות ומרוויח ${money2(perB)} ליחידה. התפנה מקום בגובה העיניים ליד הקופה. איזה מוצר הביא יותר רווח גולמי בתקופה?`,
    options: opts, explain: `מכפילים כמות ברווח ליחידה: ${esc(byQty.p)} = ${nf0.format(byQty.q)} × ${money2(perA)} = <b>${money(gpA)}</b>; ${esc(byGp.p)} = ${nf0.format(byGp.q)} × ${money2(perB)} = <b>${money(gpB)}</b>. ${winner===byQty ? 'כמות גבוהה ניצחה כאן את הרווח ליחידה.' : 'הרווח ליחידה ניצח כאן את הכמות.'} מיקום טוב מגדיל מכירות, ולכן כדאי לתת אותו למוצר שכל יחידה נוספת שלו שווה יותר: ${esc(perA>=perB?byQty.p:byGp.p)}, בתנאי שלקוחות קונים אותו גם מדחף רגעי.` };
}

function exCompare(A, B){
  if(!A.sales || !B.sales || !A.txns || !B.txns) return null;
  const ds = A.sales/B.sales - 1, dt = A.txns/B.txns - 1, da = A.avg/B.avg - 1;
  const lt = Math.log(A.txns/B.txns), la = Math.log(A.avg/B.avg);

  const opts = [
    { t: 'מספר הלקוחות (העסקאות) השתנה, וזה מה שהזיז את המכירות', ok: traffic },
    { t: 'גודל הסל (ממוצע העסקה) השתנה, וזה מה שהזיז את המכירות', ok: !traffic },
    { t: 'אי אפשר לדעת בלי נתוני רווח', ok: false },
  ];
  return { title: 'מה באמת הזיז את המכירות?', q: `בין התקופות המכירות השתנו ב־<b>${signPct(ds)}</b>. מספר העסקאות השתנה ב־<b>${signPct(dt)}</b> וממוצע העסקה ב־<b>${signPct(da)}</b>. מה הגורם העיקרי לשינוי, ולכן על מה כדאי לעבוד?`,

}

function viewActions(){

    const qty = stock != null ? Math.max(0, Math.ceil(need - stock)) : Math.ceil(need);
    const urgency = daysLeft == null ? 1 : daysLeft <= L ? 3 : daysLeft <= L + 2 ? 2 : qty > 0 ? 1 : 0;
    return { ...p, L, stock, daysLeft, qty, urgency };

  const pairs = basketPairs(A);
  const promos = buildPromos(A, pairs);
  const basket = buildBasket(A, pairs);
  const urg = u => u===3 ? '<span class="pill bad">דחוף</span>' : u===2 ? '<span class="pill warn">בקרוב</span>' : '<span class="pill neutral">רגיל</span>';
  return `${sampleBanner()}

function buildPromos(A, pairs){
  const out = [];
  const m = A.margin ?? 0.25;
  const slowHigh = A.products.filter(p => p.speed === 'slow' && p.margin != null && p.margin >= m).sort((a,b)=>b.margin-a.margin).slice(0,3);
  if(slowHigh.length) out.push({ icon:'%', t:`מבצע על מוצרים איטיים עם רווח גבוה`, d:`${slowHigh.map(p=>`${esc(p.p)} (${pct(p.margin,0)} רווח)`).join(', ')}. יש מקום להנחה של 10–15% ועדיין להרוויח. נסה ״2 ב־״ כדי להזיז מלאי.` });
  if(pairs[0]){ const x = pairs[0]; out.push({ icon:'+', t:`חבילה: ${esc(x.a)} + ${esc(x.b)}`, d:`נקנים יחד ב־${nf0.format(x.c)} עסקאות, פי ${nf1.format(x.lift)} מהצפוי. מחיר חבילה קצת נמוך מהסכום ימשוך גם את מי שקונה רק אחד מהם.` }); }
  if(A.hasHour){
    const hs = A.hourSales.map((v,h)=>({h,v})).filter(x=>x.v>0);
    if(hs.length > 4){ const low = [...hs].sort((a,b)=>a.v-b.v).slice(0,2).map(x=>x.h).sort((a,b)=>a-b); out.push({ icon:'⏱', t:`״שעה שקטה״ בשעות ${low.map(h=>h+':00').join(' ו־')}`, d:`אלה השעות החלשות ביותר. הנחה קטנה על מאפים או קפה בשעות האלה מושכת לקוחות בלי לפגוע בשעות העמוסות.` }); }
  }
  const lowMargin = A.products.filter(p => p.margin != null && p.margin < Math.min(0.12, m/2) && p.abc === 'A').slice(0,3);
  if(lowMargin.length) out.push({ icon:'!', t:'לא לעשות מבצע על מוצרי פדיון עם רווח נמוך', d:`${lowMargin.map(p=>`${esc(p.p)} (${pct(p.margin,0)})`).join(', ')} נמכרים ממילא. הנחה עליהם תוריד רווח כמעט בלי להוסיף לקוחות. השתמש בהם כ״מוצר מגנט״ במחיר רגיל, ותמכור לידם מוצרים רווחיים.` });
  const negative = A.products.filter(p => p.margin != null && p.margin < 0);
  if(negative.length) out.push({ icon:'₪', t:`${negative.length} מוצרים נמכרים מתחת לעלות`, d:`${negative.slice(0,4).map(p=>esc(p.p)).join(', ')}. בדוק אם המחיר בקופה עדכני או אם עלות הספק עלתה.` });
  return out;
}
function buildBasket(A, pairs){
  const out = [];
  const totals = [...A.txTotals.values()];
  const m = A.margin ?? 0.25;
  if(totals.length > 30){
    const med = median(totals), thr = Math.ceil(med*1.3/10)*10, share = totals.filter(t => t >= thr*0.75 && t < thr).length / totals.length;
    out.push({ icon:'↑', t:`הטבה מעל ₪${thr}`, d:`חצי מהעסקאות הן עד ${money(med)}. ${pct(share,0)} מהעסקאות נמצאות קצת מתחת ל־₪${thr}. הטבה קטנה (למשל שקית חטיף או משלוח חינם) מעל הסכום הזה מעודדת להוסיף עוד מוצר.` });
  }
  const impulse = A.products.filter(p => p.unitPrice > 0 && p.unitPrice <= Math.max(6, A.avg*0.15) && p.margin != null && p.margin >= m).sort((a,b)=>b.margin-a.margin).slice(0,4);
  if(impulse.length) out.push({ icon:'◎', t:'מוצרי דחף ליד הקופה', d:`${impulse.map(p=>`${esc(p.p)} (${money2(p.unitPrice)}, ${pct(p.margin,0)} רווח)`).join(', ')}. זולים, רווחיים וקל להוסיף אותם ברגע האחרון.` });
  if(pairs.length > 1){ const x = pairs[1]; out.push({ icon:'⇄', t:`להציב את ${esc(x.b)} ליד ${esc(x.a)}`, d:`${pct(x.confA,0)} ממי שקונה ${esc(x.a)} קונה גם ${esc(x.b)}. כשהם קרובים, גם השאר ייזכרו לקחת.` }); }
  if(!A.txns) return out;
  const add = A.txns * 0.1 * Math.max(5, A.avg*0.12);
  const perMonth = A.activeDays ? add / A.activeDays * 26 : 0;
  out.push({ icon:'=', t:'מה זה שווה בכסף', d:`אם רק 1 מכל 10 לקוחות יוסיף מוצר של ${money(Math.max(5, A.avg*0.12))}, המכירות יגדלו בכ־${money(perMonth)} בחודש, ורווח גולמי של כ־${money(perMonth*m)}.` });
  out.push({ icon:'?', t:'לשאול ״עוד משהו?״', d:'הקופאי מציע מוצר אחד קבוע של השבוע (למשל מאפה טרי). זה עולה אפס ומשפיע ישר על ממוצע העסקה.' });
  return out;
}
function afterActions(){
  $('#pLead')?.addEventListener('change', e => { S.plan.lead = Math.max(0, +e.target.value || 0); render(); });

function exActions(A){
  const cand = A.products.filter(p => p.margin != null && p.margin > 0.15 && p.q >= 5).sort((a,b)=>b.s-a.s)[0];
  if(!cand) return null;
  const m = cand.margin, disc = 0.1;
  const need = disc / (m - disc);
  const wrong1 = disc, wrong2 = need * 2;
  const opts = shuffleOpts([
    { t: `בערך ${pct(wrong1,0)} יותר יחידות, כמו גובה ההנחה`, ok: false },
    { t: `בערך ${pct(need,0)} יותר יחידות`, ok: true },
    { t: `בערך ${pct(wrong2,0)} יותר יחידות`, ok: false },
  ], Math.round(m*1000));
  return { title: 'כמה צריך למכור יותר אחרי הנחה?', q: `על <b>${esc(cand.p)}</b> הרווח הגולמי הוא ${pct(m)} (מחיר ${money2(cand.unitNet)}${A.hasVat ? ' לפני מע״מ' : ''}, עלות ${money2(cand.cost)}). אתה שוקל הנחה של 10%. בכמה צריכה לעלות הכמות הנמכרת כדי שהרווח הגולמי הכולל לא ירד?`,
    options: opts, explain: `לפני ההנחה הרווח ליחידה הוא ${money2(cand.unitNet - cand.cost)}. אחרי 10% הנחה המחיר ${money2(cand.unitNet*0.9)} והרווח ליחידה ${money2(cand.unitNet*0.9 - cand.cost)}. הנוסחה: הנחה ÷ (% רווח − הנחה) = 10% ÷ (${pct(m)} − 10%) = <b>${pct(need,0)}</b>. כלומר הנחה ״קטנה״ דורשת קפיצה גדולה במכירות. מבצע כדאי כשהוא מביא לקוחות חדשים או מזיז מלאי תקוע, לא רק כדי ״למכור יותר״.` };
}

function exExpenses(A, m, dpm, F, gpMonth){
  const raise = 2000;
  const perDay = raise / dpm / m * A.grossFactor;
  const naive = raise / dpm;
  const opts = shuffleOpts([
    { t: `כ־${money(naive)} ביום, כי ₪${nf0.format(raise)} חלקי ${nf0.format(dpm)} ימים`, ok: false },
    { t: `כ־${money(perDay)} ביום`, ok: true },
    { t: `כ־${money(perDay*m*m)} ביום`, ok: false },
  ], Math.round(m*977));
  return { title: 'העלאת שכר: כמה צריך למכור יותר?', q: `עובד מבקש העלאה של <b>₪${nf0.format(raise)}</b> בחודש. החנות פתוחה כ־${nf0.format(dpm)} ימים בחודש, ושיעור הרווח הגולמי שלך ${pct(m)}. כמה מכירות נוספות ביום צריך כדי לכסות את ההעלאה?`,
    options: opts, explain: `כל שקל מכירה מכניס רק ${pct(m)} רווח גולמי. לכן: ₪${nf0.format(raise)} ÷ ${nf0.format(dpm)} ימים = ${money(naive)} רווח ביום, ובמכירות: ${money(naive)} ÷ ${pct(m)} = <b>${money(perDay / A.grossFactor)}</b> ביום${A.hasVat ? `, לפני מע״מ. עם מע״מ, כמו שרואים בקופה, זה <b>${money(perDay)}</b>` : ''}. ${A.txns ? `זה בערך ${nf1.format(perDay/Math.max(A.avg,1))} עסקאות ממוצעות נוספות ביום.` : ''} אם העובד הזה עוזר להשיג את זה (פחות תורים, מדפים מלאים) ההעלאה מצדיקה את עצמה.` };
}

let xlsxLoading = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLoading ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxLoading = null; rej(new Error('לא הצלחתי לטעון את קורא האקסל')); }; document.head.appendChild(s); });
}
async function handleFile(f, kind){
  try {
    let aoa;
    if(/\.xlsx?$/i.test(f.name)){
      const X = await loadXLSX(); const wb = X.read(await f.arrayBuffer(), { type:'array', cellDates:true });
      // pick the sheet with the most rows
      let best = null; wb.SheetNames.forEach(n => { const a = X.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:'' }); if(!best || a.length > best.length) best = a; });
      aoa = best || [];
    } else {
      const buf = await f.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if(text.includes('\uFFFD')) { try { text = new TextDecoder('windows-1255').decode(buf); } catch(e){} }
      aoa = parseDelimited(text.replace(/^\uFEFF/, ''));
    }
    prepareMapping(aoa, f.name.replace(/\.[^.]+$/, ''), kind);
  } catch(e){ showMapMsg(kind, 'לא הצלחתי לקרוא את הקובץ: ' + (e.message || e), true); }
}
function parseDelimited(text){
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const delim = ['\t',';',','].map(d => [d, first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if(ch === '"' && cell === '') { q = true; continue; }
    if(ch === delim){ row.push(cell); cell = ''; continue; }
    if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; continue; }
    cell += ch;
  }
  if(cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function prepareMapping(aoa, name, kind){
  if(!aoa || aoa.length < 2){ showMapMsg(kind, 'הקובץ ריק או שיש בו פחות משתי שורות.', true); return; }
  const allKw = FIELDS[kind].flatMap(f => f[3]);
  let hi = 0, best = -1;
  for(let i=0;i<Math.min(20, aoa.length);i++){ const sc = aoa[i].filter(c => typeof c === 'string' && allKw.some(k => c.toLowerCase().includes(k.toLowerCase()))).length; if(sc > best){ best = sc; hi = i; } }
  const headers = aoa[hi].map((h,i) => String(h || '').trim() || ('עמודה ' + (i+1)));
  const data = aoa.slice(hi+1);
  const map = {}, used = new Set();
  FIELDS[kind].forEach(([key,, , kws]) => {
    let bi = -1, bs = 0;
    headers.forEach((h, i) => {
      if(used.has(i)) return; const hl = h.toLowerCase();
      kws.forEach((k, ki) => { if(hl.includes(k.toLowerCase())){ let s = 100 - ki + (hl === k.toLowerCase() ? 50 : 0); if(key==='product' && /קוד|ברקוד|מק"ט|מק״ט|barcode|sku/.test(hl)) s -= 200; if(['profit','cost','total','price','qty'].includes(key) && /%|אחוז/.test(hl)) s -= 200; if(s > bs){ bs = s; bi = i; } } });
    });
    if(bi >= 0 && bs > 0){ map[key] = bi; used.add(bi); }
  });
  S.pending = { kind, name, headers, data, map };
  renderMapping();
}

function guessCostMode(P){
  const M = P.map; if(M.cost == null) return 'unit';
  const ratios = [];
  for(const r of P.data.slice(0, 400)){
    const q = M.qty != null ? num(r[M.qty]) : 1, k = num(r[M.cost]);
    let s = M.total != null ? num(r[M.total]) : NaN; if(isNaN(s) && M.price != null) s = num(r[M.price]) * q;
    if(!(q > 1) || !(k > 0) || !(s > 0)) continue;
    if(M.profit != null){ const pr = num(r[M.profit]); if(!isNaN(pr)){ const line = Math.abs(s/(1+VAT) - pr - k) < Math.abs(s - pr - k) || Math.abs(s/(1+VAT) - pr - k*q) < Math.abs(s - pr - k*q) ? s/(1+VAT) - pr : s - pr; ratios.push(Math.abs(k - line) < Math.abs(k*q - line) ? 2 : 0.5); continue; } }
    ratios.push(k / (s / q));
  }
  return median(ratios) > 1.2 ? 'line' : 'unit';
}
const VAT = 0.18;
function detectVat(P){
  const M = P.map; if(M.profit == null || M.cost == null || M.product == null) return null;
  let inc = 0, exc = 0; const exempt = new Set(), taxed = new Set();
  for(const r of P.data){
    const q = M.qty != null ? num(r[M.qty]) : 1, pr = num(r[M.profit]), sv = M.total != null ? num(r[M.total]) : NaN;
    let k = num(r[M.cost]); if(!(q > 0) || !(k > 0) || isNaN(pr) || !(sv > 0)) continue;
    if(P.costMode === 'line') k = k / q;
    const eV = Math.abs(sv/(1+VAT) - q*k - pr), e0 = Math.abs(sv - q*k - pr), tol = 0.05*Math.max(1, Math.abs(pr)) + 0.05;
    const name = String(r[M.product] ?? '').trim();
    if(eV <= tol && eV <= e0){ inc++; taxed.add(name); } else if(e0 <= tol){ exc++; exempt.add(name); }
  }
  if(inc + exc < 5) return null;
  return { included: inc >= exc, exempt: inc >= exc ? [...exempt].filter(n => !taxed.has(n)) : [] };

function num(v){ if(typeof v === 'number') return v; if(v == null) return NaN; let s = String(v).replace(/[₪\s,]/g,'').replace(/[^\d.\-()]/g,''); if(/^\(.*\)$/.test(s)) s = '-' + s.slice(1,-1); if(/-$/.test(s)) s = '-' + s.slice(0,-1); return s === '' ? NaN : parseFloat(s); }

/* ---------- router & render ---------- */
function emptyView(){
  return `${sampleBanner()}<section class="panel empty"><h2>אין מכירות בסינון הזה</h2><p style="margin-top:6px">נסה טווח תאריכים אחר, נקה את הסינון, או העלה דוח.</p><div class="row-actions" style="justify-content:center;margin-top:12px"><button type="button" class="btn" id="emptyClear">נקה סינון</button><a class="btn primary" href="#data">העלאת דוח</a></div></section>`;
}
const VIEWS = { dashboard: [viewDashboard, afterDashboard], products: [viewProducts, afterProducts], compare: [viewCompare, afterCompare], actions: [viewActions, afterActions], expenses: [viewExpenses, afterExpenses], data: [viewData, afterData] };
function setStatus(){
  const el = $('#status');
  const m = Store.mode === 'db' ? ['ok','נשמר בחשבון'] : Store.mode === 'local' ? ['warn','נשמר בדפדפן הזה'] : ['','מתחבר…'];
  el.innerHTML = `<span class="dot ${m[0]}"></span>${S.sample ? 'נתוני דוגמה · ' : ''}${m[1]}`;
}
function render(){
  const h = location.hash.replace('#','');
  S.tab = VIEWS[h] ? h : 'dashboard';
  document.querySelectorAll('#tabs a').forEach(a => { if(a.dataset.tab === S.tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  renderFilters();
  const [v, after] = VIEWS[S.tab];
  const view = $('#view');
  view.innerHTML = v();
  after && after();
  wireExercises(view); wireTips(view);
  $('#emptyClear')?.addEventListener('click', () => { S.filter = { from:'', to:'', cat:'', prod:'' }; render(); });
  $('#btnSave').disabled = !S.rows.length; $('#btnExport').disabled = !S.rows.length;
  setStatus();
}
window.addEventListener('hashchange', () => { window.scrollTo(0,0); render(); });
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if(S.tab === 'dashboard') afterDashboard(); if(S.tab === 'compare') afterCompare(); }, 200); });
$('#btnSave').addEventListener('click', openSave);
$('#btnExport').addEventListener('click', openExport);

/* ---------- boot ---------- */
(function boot(){
  const smp = buildSample();
  S.reports = [{ id:'sample', name:'נתוני דוגמה', from:'', to:'', rows: smp.rows, active:true }];
  S.catalog = smp.catalog; S.fixed = smp.fixed;
  rebuildRows();
  render();
  Store.init().then(async () => {
    try {
      const d = await Store.loadAll();
      const hasData = d.reports.length || Object.keys(d.catalog).length || d.fixed;
      if(hasData){
        S.sample = false;
        S.reports = d.reports.map(r => ({ ...r, _chunkCount: r.chunkCount }));
        S.catalog = d.catalog || {};
        S.fixed = { electricity:0, arnona:0, bank:0, salary:0, loans:0, rent:0, other:0, ...(d.fixed || {}) };
        S.analyses = d.analyses || [];
        S.answered = {};
        rebuildRows();
      }
    } catch(e){ toast('טעינת הנתונים השמורים נכשלה. מוצגים נתוני דוגמה.'); }
    render();
  });
})();
})();
</script>
